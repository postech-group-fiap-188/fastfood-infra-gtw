name: Terraform Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AUTH_LAMBDA_INVOKE_ARN: ${{ secrets.AUTH_LAMBDA_INVOKE_ARN }}
      AUTHORIZER_LAMBDA_INVOKE_ARN: ${{ secrets.AUTHORIZER_LAMBDA_INVOKE_ARN }}
      PRODUCTS_SERVICE_URL: ${{ secrets.PRODUCTS_SERVICE_URL }}
      ORDERS_SERVICE_URL: ${{ secrets.ORDERS_SERVICE_URL }}
      PAYMENTS_SERVICE_URL: ${{ secrets.PAYMENTS_SERVICE_URL }}
      KITCHEN_SERVICE_URL: ${{ secrets.KITCHEN_SERVICE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Create temporary backend config
        run: |
          echo 'terraform {' > backend_override.tf
          echo '  backend "local" {}' >> backend_override.tf
          echo '}' >> backend_override.tf

      - name: Terraform Init (no backend)
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dry-run)
        run: |
          terraform plan -input=false -no-color \
            -var="region=$AWS_REGION" \
            -var="auth_lambda_invoke_arn=$AUTH_LAMBDA_INVOKE_ARN" \
            -var="authorizer_lambda_invoke_arn=$AUTHORIZER_LAMBDA_INVOKE_ARN" \
            -var="products_service_url=$PRODUCTS_SERVICE_URL" \
            -var="orders_service_url=$ORDERS_SERVICE_URL" \
            -var="payments_service_url=$PAYMENTS_SERVICE_URL" \
            -var="kitchen_service_url=$KITCHEN_SERVICE_URL"
